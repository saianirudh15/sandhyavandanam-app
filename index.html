<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sandhya" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <title>Sandhyavandanam</title>
  </head>
  <body>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #fff7ed; overflow: hidden; }
      #root { width: 100%; height: 100%; }
      .splash-container { position: fixed; top: 0; left: 0; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; width: 100vw; background: linear-gradient(to bottom, #ea580c, #c2410c); transition: opacity 0.5s ease-out; }
      .splash-icon { width: 120px; height: 120px; margin-bottom: 24px; animation: pulse 2.5s infinite ease-in-out; }
      .splash-text { color: white; font-family: system-ui, -apple-system, sans-serif; font-size: 24px; font-weight: bold; letter-spacing: 2px; }
      .fade-out { opacity: 0; pointer-events: none; }
      @keyframes pulse { 0% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); opacity: 0.85; } }
    </style>
    <div id="splash-screen" class="splash-container">
      <svg class="splash-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="100" fill="transparent" stroke="rgba(255,255,255,0.2)" stroke-width="20"/>
        <text x="50%" y="60%" font-family="Arial" font-size="200" fill="white" font-weight="bold" text-anchor="middle">ॐ</text>
      </svg>
      <div class="splash-text">SANDHYA</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Failsafe: if React fails to load or execute, hide the splash screen to reveal the error
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.style.display = 'none';
            console.error('Splash screen failsafe triggered. React may have failed to initialize properly.');
            if (document.getElementById('root').innerHTML.trim() === '') {
              document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red; text-align: center; margin-top: 100px; font-family: sans-serif;">Oops, an error occurred while loading the app. Please clear your site data/cache and refresh.</div>';
            }
            
          }
        }, 4000);
      });
    </script>
  </body>
</html>
